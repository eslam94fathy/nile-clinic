openapi: 3.1.0
info:
  title: Nile Clinic API — Doctors and Specialties
  version: 1.0.0
  description: >
    Endpoints introduced by feature 004. All responses are JSON, and field names and structure
    are identical in every locale; only `message` texts change with Accept-Language (en, ar;
    fallback en). Specialties always carry both `name_en` and `name_ar` (FR-004a); entered values
    are returned exactly as stored, never translated. Every endpoint requires
    `Authorization: Bearer <token>` (feature 002). Reading is open to every active staff member;
    changes are for active administrators only (FR-003, FR-010).
servers:
  - url: http://localhost:8080/api/v1
    description: Local Docker Compose environment (port from APP_PORT)

security:
  - bearerToken: []

paths:
  /specialties:
    get:
      operationId: listSpecialties
      summary: List the specialty catalog (FR-004)
      description: Unpaginated, ordered by `name_en` (research R5). Any active staff member.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - in: query
          name: is_active
          description: '`1` for active only, `0` for deactivated only; omitted lists all.'
          schema: { type: boolean }
      responses:
        '200':
          description: The catalog
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Specialty' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: createSpecialty
      summary: Add a specialty (FR-001–FR-003) — administrators
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name_en, name_ar]
              properties:
                name_en: { $ref: '#/components/schemas/SpecialtyName' }
                name_ar: { $ref: '#/components/schemas/SpecialtyName' }
            example: { name_en: Cardiology, name_ar: أمراض القلب }
      responses:
        '201':
          description: Created as active
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Specialty' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Validation error, including a name already used by another specialty (case and extra spaces ignored)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }

  /specialties/{specialty}:
    patch:
      operationId: renameSpecialty
      summary: Rename a specialty (FR-002, FR-003) — administrators
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/SpecialtyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              description: Send at least one name; an empty body is `422` (`nothing_to_update`).
              properties:
                name_en: { $ref: '#/components/schemas/SpecialtyName' }
                name_ar: { $ref: '#/components/schemas/SpecialtyName' }
      responses:
        '200': { $ref: '#/components/responses/SpecialtyOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/SpecialtyNotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /specialties/{specialty}/deactivate:
    post:
      operationId: deactivateSpecialty
      summary: Deactivate a specialty (FR-003, FR-008) — administrators
      description: Idempotent. Doctors already assigned keep it; it can no longer be newly assigned.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/SpecialtyId'
      responses:
        '200': { $ref: '#/components/responses/SpecialtyOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/SpecialtyNotFound' }

  /specialties/{specialty}/reactivate:
    post:
      operationId: reactivateSpecialty
      summary: Reactivate a specialty (FR-003) — administrators
      description: Idempotent.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/SpecialtyId'
      responses:
        '200': { $ref: '#/components/responses/SpecialtyOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/SpecialtyNotFound' }

  /doctors:
    get:
      operationId: listDoctors
      summary: List and search doctors (FR-013–FR-015)
      description: >
        Any active staff member. Filters are optional and combine with AND. Ordered by name, then
        id. Items never include the account email, role, or user id.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - in: query
          name: name
          description: >
            Part of the doctor's name. Matching ignores case, extra spaces, and the Arabic variants
            أ/إ/آ = ا, ة = ه, ى = ي (research R4).
          schema: { type: string, minLength: 1, maxLength: 255 }
        - in: query
          name: specialty_id
          description: Only doctors assigned this specialty (active or not).
          schema: { type: integer, minimum: 1 }
        - in: query
          name: is_active
          description: '`1` for active doctors only (account active with the doctor role), `0` for inactive only.'
          schema: { type: boolean }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
      responses:
        '200':
          description: One page of doctors in Laravel's paginated resource shape. No matches is an empty `data` array.
          content:
            application/json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DoctorSummary' }
                  links: { type: object }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: createDoctor
      summary: Create a doctor profile for a staff account (FR-005–FR-009) — administrators
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, title, specialty_ids]
              properties:
                user_id:
                  type: integer
                  minimum: 1
                  description: An active staff account with the doctor role and no profile yet.
                title: { $ref: '#/components/schemas/Title' }
                registration_number: { $ref: '#/components/schemas/RegistrationNumber' }
                specialty_ids: { $ref: '#/components/schemas/SpecialtyIds' }
            example: { user_id: 7, title: Consultant, registration_number: A12345, specialty_ids: [1, 3] }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Doctor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: >
            Validation error: unknown account, account not active or not a doctor, account already
            has a profile, registration number taken, no specialties, unknown or deactivated
            specialty.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }

  /doctors/me:
    get:
      operationId: showOwnDoctorProfile
      summary: The signed-in doctor's own profile (FR-017)
      description: Active staff with the doctor role only; other roles get 403.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200': { $ref: '#/components/responses/DoctorOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/DoctorNotFound' }

  /doctors/{doctor}:
    get:
      operationId: showDoctor
      summary: View a doctor profile (FR-016) — any active staff member
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/DoctorId'
      responses:
        '200': { $ref: '#/components/responses/DoctorOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/DoctorNotFound' }
    patch:
      operationId: updateDoctor
      summary: Update a doctor profile (FR-007–FR-010) — administrators
      description: >
        Partial update. `specialty_ids`, when sent, replaces the whole set; a specialty already
        assigned may stay even if deactivated. `registration_number: null` clears it. The linked
        account cannot be changed.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/DoctorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title: { $ref: '#/components/schemas/Title' }
                registration_number: { $ref: '#/components/schemas/RegistrationNumber' }
                specialty_ids: { $ref: '#/components/schemas/SpecialtyIds' }
      responses:
        '200': { $ref: '#/components/responses/DoctorOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/DoctorNotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: The `token` value returned by sign-in (feature 002).

  parameters:
    AcceptLanguage:
      in: header
      name: Accept-Language
      required: false
      description: en or ar (regional variants map to the base language); anything else falls back to en.
      schema: { type: string }
    SpecialtyId:
      in: path
      name: specialty
      required: true
      schema: { type: integer, minimum: 1 }
    DoctorId:
      in: path
      name: doctor
      required: true
      description: The doctor id (not the staff account id).
      schema: { type: integer, minimum: 1 }

  schemas:
    SpecialtyName:
      type: string
      minLength: 1
      maxLength: 100
      description: Trimmed and repeated spaces collapsed before storing.
    Title:
      type: string
      minLength: 1
      maxLength: 100
      example: Consultant
    RegistrationNumber:
      type: [string, 'null']
      pattern: '^[A-Za-z0-9]{1,30}$'
      description: Medical syndicate registration number. Optional; unique when given.
    SpecialtyIds:
      type: array
      minItems: 1
      uniqueItems: true
      items: { type: integer, minimum: 1 }
    Specialty:
      type: object
      additionalProperties: false
      required: [id, name_en, name_ar, is_active]
      properties:
        id: { type: integer }
        name_en: { type: string }
        name_ar: { type: string }
        is_active: { type: boolean }
    DoctorSummary:
      type: object
      description: List shape (FR-015). Exactly these five fields.
      additionalProperties: false
      required: [id, name, title, is_active, specialties]
      properties:
        id: { type: integer, description: Doctor id }
        name: { type: string, description: From the linked staff account }
        title: { type: string }
        is_active: { type: boolean, description: Account active and has the doctor role (FR-012) }
        specialties:
          type: array
          items: { $ref: '#/components/schemas/Specialty' }
    Doctor:
      type: object
      description: A single profile (FR-016).
      additionalProperties: false
      required: [id, name, title, is_active, specialties, registration_number, created_at, updated_at]
      properties:
        id: { type: integer }
        name: { type: string }
        title: { type: string }
        is_active: { type: boolean }
        specialties:
          type: array
          items: { $ref: '#/components/schemas/Specialty' }
        registration_number: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Message:
      type: object
      required: [message]
      properties:
        message: { type: string, description: Translated per Accept-Language }
    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

  responses:
    SpecialtyOk:
      description: The specialty after the change
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/Specialty' }
    DoctorOk:
      description: The doctor profile
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/Doctor' }
    Unauthenticated:
      description: Missing, malformed, expired, or revoked token, or a deactivated account
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
          example: { message: You are not signed in. }
    Forbidden:
      description: Not an administrator (changes), or not a doctor (`/doctors/me`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
          example: { message: You are not allowed to perform this action. }
    SpecialtyNotFound:
      description: No specialty with this id
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
          example: { message: No specialty was found. }
    DoctorNotFound:
      description: No doctor with this id, or the signed-in doctor has no profile yet
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
          example: { message: No doctor was found. }
    ValidationFailed:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
