# Local development stack (plan: Compose responsibilities). Values come from .env (see .env.example).
services:
  app:
    build:
      context: docker/php
    # No env_file/environment: Laravel reads .env from the bind mount, so phpunit.xml
    # can always override DB settings for tests (analysis C1).
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy

  web:
    image: nginx:1.30.6-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:9.7.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    # No ports: the database is reachable only on the Compose network (FR-005).
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      DB_TEST_DATABASE: ${DB_TEST_DATABASE}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP (127.0.0.1) so the check stays unhealthy during first-time init,
      # when MySQL's temporary server accepts socket connections only.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mysql-data: {}
  vendor: {}
