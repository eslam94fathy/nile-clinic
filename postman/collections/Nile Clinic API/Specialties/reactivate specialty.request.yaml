$kind: http-request
description: |-
  Idempotent. Runs after "deactivate specialty", so the Doctors folder can assign it.
method: POST
url: '{{base_url}}/specialties/:specialty/reactivate'
order: 5000
pathVariables:
  - key: 'specialty'
    value: '{{specialty_id}}'
headers:
  - key: 'Accept'
    value: 'application/json'
  - key: 'Accept-Language'
    value: '{{locale}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 and active', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().data.is_active).to.eql(true);
      });
examples: './.resources/reactivate specialty.resources/examples'
