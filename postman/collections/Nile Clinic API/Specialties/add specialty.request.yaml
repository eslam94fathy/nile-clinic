$kind: http-request
description: |-
  Add an active specialty. Both names required, at most 100 characters, each unique (case and
  extra spaces ignored, deactivated specialties included). The pre-request script makes the
  synthetic names unique; the id is stored in `specialty_id`.
method: POST
url: '{{base_url}}/specialties'
order: 2000
headers:
  - key: 'Accept'
    value: 'application/json'
  - key: 'Accept-Language'
    value: '{{locale}}'
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "name_en": "Postman Specialty {{specialty_suffix}}",
      "name_ar": "تخصص بوستمان {{specialty_suffix}}"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: 'pm.collectionVariables.set(''specialty_suffix'', String(Date.now()));'
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('201 active with both names', () => {
        pm.response.to.have.status(201);
        const data = pm.response.json().data;
        pm.expect(data.name_en).to.eql('Postman Specialty ' + pm.collectionVariables.get('specialty_suffix'));
        pm.expect(data.is_active).to.eql(true);
        pm.collectionVariables.set('specialty_id', String(data.id));
      });
examples: './.resources/add specialty.resources/examples'
