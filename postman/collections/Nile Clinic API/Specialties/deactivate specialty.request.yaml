$kind: http-request
description: |-
  Idempotent. Doctors already assigned keep it; it can no longer be newly assigned.
method: POST
url: '{{base_url}}/specialties/:specialty/deactivate'
order: 4000
pathVariables:
  - key: 'specialty'
    value: '{{specialty_id}}'
headers:
  - key: 'Accept'
    value: 'application/json'
  - key: 'Accept-Language'
    value: '{{locale}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 and deactivated', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().data.is_active).to.eql(false);
      });
examples: './.resources/deactivate specialty.resources/examples'
