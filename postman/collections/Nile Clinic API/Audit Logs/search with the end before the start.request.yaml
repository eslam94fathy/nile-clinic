$kind: http-request
description: |-
  `to` may not be before `from`.
method: GET
url: '{{base_url}}/audit-entries?from=2026-11-05&to=2026-11-01'
order: 9000
queryParams:
  - key: 'from'
    value: '2026-11-05'
  - key: 'to'
    value: '2026-11-01'
headers:
  - key: 'Accept'
    value: 'application/json'
  - key: 'Accept-Language'
    value: '{{locale}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('422 on to', () => {
        pm.response.to.have.status(422);
        pm.expect(pm.response.json().errors).to.have.property('to');
      });
examples: './.resources/search with the end before the start.resources/examples'
