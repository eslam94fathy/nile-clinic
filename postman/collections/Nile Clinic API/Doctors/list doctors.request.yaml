$kind: http-request
description: |-
  One page of doctors ordered by name, then id. Filters combine with AND. Name search ignores
  case, extra spaces, and the Arabic variants أ/إ/آ = ا, ة = ه, ى = ي. Items have exactly id,
  name, title, is_active, specialties.
method: GET
url: '{{base_url}}/doctors?specialty_id={{specialty_id}}&per_page=15'
order: 3000
queryParams:
  - key: 'specialty_id'
    value: '{{specialty_id}}'
    description: 'Doctors assigned this specialty'
  - key: 'name'
    value: 'postman'
    description: 'Part of the doctor''s name'
    disabled: true
  - key: 'is_active'
    value: '1'
    description: '1 active only (account active with the doctor role), 0 inactive only'
    disabled: true
  - key: 'page'
    value: '1'
    disabled: true
  - key: 'per_page'
    value: '15'
    description: '1–100, default 15'
headers:
  - key: 'Accept'
    value: 'application/json'
  - key: 'Accept-Language'
    value: '{{locale}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 lists the new doctor with summary fields only', () => {
        pm.response.to.have.status(200);
        const data = pm.response.json().data;
        pm.expect(data.map((d) => d.id)).to.include(Number(pm.collectionVariables.get('doctor_id')));
        data.forEach((d) => pm.expect(d).to.have.keys('id', 'name', 'title', 'is_active', 'specialties'));
      });
examples: './.resources/list doctors.resources/examples'
