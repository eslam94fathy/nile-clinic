$kind: http-request
description: |-
  Partial update of title, registration_number (`null` clears it), and specialty_ids (replaces
  the set; an assigned specialty may stay after it is deactivated). The linked account never
  changes. Administrators only, including for a doctor's own profile.
method: PATCH
url: '{{base_url}}/doctors/:doctor'
order: 5000
pathVariables:
  - key: 'doctor'
    value: '{{doctor_id}}'
    description: 'The doctor id'
headers:
  - key: 'Accept'
    value: 'application/json'
  - key: 'Accept-Language'
    value: '{{locale}}'
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "title": "Senior Consultant"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 with the new title', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().data.title).to.eql('Senior Consultant');
      });
examples: './.resources/update doctor profile.resources/examples'
