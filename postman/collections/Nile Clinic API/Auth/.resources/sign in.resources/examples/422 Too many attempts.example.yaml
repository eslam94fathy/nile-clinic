$kind: http-example
request:
  url: '{{base_url}}/auth/sign-in'
  method: POST
response:
  statusCode: 422
  statusText: Unprocessable Content
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {"message": "Too many login attempts. Please try again in 55 seconds.", "errors": {"email": ["Too many login attempts. Please try again in 55 seconds."]}}
