$kind: http-request
description: |-
  Change your own password (12–72 characters, confirmed). Ends your other tokens; the token used
  for this request stays valid. Wrong current passwords count toward the sign-in per-email limit.
  This run sets the password to its current value, so the administrator's password is unchanged.
method: PUT
url: '{{base_url}}/auth/password'
order: 3000
headers:
  - key: Accept
    value: application/json
  - key: Accept-Language
    value: '{{locale}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "current_password": "{{admin_password}}",
      "password": "{{admin_password}}",
      "password_confirmation": "{{admin_password}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('204 No Content', () => pm.response.to.have.status(204));
examples: './.resources/change own password.resources/examples'
