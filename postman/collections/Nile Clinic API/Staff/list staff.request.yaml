$kind: http-request
description: |-
  One page of staff accounts ordered by name, then id. Laravel's paginated shape: data, links, meta.
method: GET
url: '{{base_url}}/staff?per_page=15'
order: 1000
headers:
  - key: Accept
    value: application/json
  - key: Accept-Language
    value: '{{locale}}'
queryParams:
  - key: role
    value: receptionist
    description: administrator, receptionist, or doctor
    disabled: true
  - key: is_active
    value: 'true'
    description: true/false or 1/0
    disabled: true
  - key: page
    value: '1'
    disabled: true
  - key: per_page
    value: '15'
    description: 1–100, default 15
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 paginated, no passwords', () => {
        pm.response.to.have.status(200);
        const body = pm.response.json();
        pm.expect(body).to.have.keys('data', 'links', 'meta');
        pm.expect(pm.response.text()).to.not.include('password');
      });
examples: './.resources/list staff.resources/examples'
