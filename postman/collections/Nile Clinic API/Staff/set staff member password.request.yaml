$kind: http-request
description: Set a new password for a staff member; ends all of that member's tokens.
method: PUT
url: '{{base_url}}/staff/:staffMember/password'
order: 5000
pathVariables:
  - key: staffMember
    value: '{{staff_member_id}}'
headers:
  - key: Accept
    value: application/json
  - key: Accept-Language
    value: '{{locale}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "password": "postman-member-pass-2",
      "password_confirmation": "postman-member-pass-2"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('204 No Content', () => pm.response.to.have.status(204));
