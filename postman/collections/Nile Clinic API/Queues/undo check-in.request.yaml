$kind: http-request
description: |-
  Undo a mistaken check-in of a waiting entry with an appointment: the entry is removed and the appointment
  is `scheduled` again. Its queue number is not reused. A walk-in is corrected by marking it as left.
method: DELETE
url: '{{base_url}}/queue/:entry'
order: 26000
pathVariables:
  - key: 'entry'
    value: '{{queue_undo_entry_id}}'
    description: 'The queue entry id'
headers:
  - key: 'Accept'
    value: 'application/json'
  - key: 'Accept-Language'
    value: '{{locale}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('204 No Content', () => pm.response.to.have.status(204));
examples: './.resources/undo check-in.resources/examples'
