$kind: http-request
description: |-
  After the visit, the appointment is `completed`. Like `checked_in`, it keeps its slot and cannot be rescheduled, cancelled, or marked no-show.
method: GET
url: '{{base_url}}/appointments/:appointment'
order: 20000
pathVariables:
  - key: 'appointment'
    value: '{{queue_appointment_id}}'
    description: 'The appointment id'
headers:
  - key: 'Accept'
    value: 'application/json'
  - key: 'Accept-Language'
    value: '{{locale}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 completed', () => pm.expect(pm.response.json().data.status).to.eql('completed'));
examples: './.resources/get completed appointment.resources/examples'
