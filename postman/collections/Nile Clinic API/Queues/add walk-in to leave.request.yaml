$kind: http-request
description: |-
  Setup: the same patient can join again once seen. The new entry is stored in `queue_left_entry_id`.
method: POST
url: '{{base_url}}/queue/walk-ins'
order: 21000
headers:
  - key: 'Accept'
    value: 'application/json'
  - key: 'Accept-Language'
    value: '{{locale}}'
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "patient_id": {{queue_patient_id}},
      "doctor_id": {{doctor_id}}
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('201 waiting', () => {
        pm.response.to.have.status(201);
        pm.collectionVariables.set('queue_left_entry_id', String(pm.response.json().data.id));
      });
examples: './.resources/add walk-in to leave.resources/examples'
