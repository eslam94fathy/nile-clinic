$kind: http-request
description: |-
  A doctor has at most one patient at a time: 422 `visit_in_progress` on `queue`.
method: POST
url: '{{base_url}}/doctors/me/queue/call-next'
order: 15000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{doctor_token}}'
headers:
  - key: 'Accept'
    value: 'application/json'
  - key: 'Accept-Language'
    value: '{{locale}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('422 visit in progress', () => {
        pm.response.to.have.status(422);
        pm.expect(pm.response.json().errors).to.have.property('queue');
      });
examples: './.resources/call next during a visit.resources/examples'
