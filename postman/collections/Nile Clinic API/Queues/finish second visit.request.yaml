$kind: http-request
description: |-
  Finishes the second visit, so everyone on the list has now been seen.
method: POST
url: '{{base_url}}/doctors/me/queue/finish'
order: 18000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{doctor_token}}'
headers:
  - key: 'Accept'
    value: 'application/json'
  - key: 'Accept-Language'
    value: '{{locale}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 seen', () => pm.expect(pm.response.json().data.status).to.eql('seen'));
examples: './.resources/finish second visit.resources/examples'
