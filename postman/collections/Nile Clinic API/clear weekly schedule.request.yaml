$kind: http-request
description: |-
  Clean-up after the Scheduling and Appointments folders: the doctor then has no working hours
  and no slots. Never blocked by appointments; any upcoming ones would show
  `outside_availability: true`. Idempotent. Runs just before sign out.
method: DELETE
url: '{{base_url}}/doctors/:doctor/schedule'
order: 8500
pathVariables:
  - key: 'doctor'
    value: '{{doctor_id}}'
    description: 'The doctor id (not the staff account id)'
headers:
  - key: 'Accept'
    value: 'application/json'
  - key: 'Accept-Language'
    value: '{{locale}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: 'pm.test(''204 No Content'', () => pm.response.to.have.status(204));'
examples: './.resources/clear weekly schedule.resources/examples'
