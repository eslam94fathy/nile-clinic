$kind: http-request
description: |-
  Set or replace a discount; administrators only. `reason` is required. The fee stays visible, and sending 0 removes
  a discount.
method: PUT
url: '{{base_url}}/charges/:charge/discount'
order: 20000
pathVariables:
  - key: 'charge'
    value: '{{second_charge_id}}'
    description: 'The charge id'
headers:
  - key: 'Accept'
    value: 'application/json'
  - key: 'Accept-Language'
    value: '{{locale}}'
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "amount": "150.00",
      "reason": "Postman synthetic hardship"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 less is owed', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().data).to.include({ fee: '400.00', discount: '150.00', amount_due: '250.00', balance: '250.00' });
      });
examples: './.resources/set discount.resources/examples'
