$kind: http-request
description: |-
  A visit has at most one active charge, also under simultaneous requests: 422 `already_charged` on `visit`.
method: POST
url: '{{base_url}}/visits/:visit/charge'
order: 6000
pathVariables:
  - key: 'visit'
    value: '{{visit_id}}'
    description: 'The queue entry id'
headers:
  - key: 'Accept'
    value: 'application/json'
  - key: 'Accept-Language'
    value: '{{locale}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('422 already charged', () => {
        pm.response.to.have.status(422);
        pm.expect(pm.response.json().errors).to.have.property('visit');
      });
examples: './.resources/charge visit again.resources/examples'
