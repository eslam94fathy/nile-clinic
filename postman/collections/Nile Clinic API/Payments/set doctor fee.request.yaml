$kind: http-request
description: |-
  Set or change a doctor's consultation fee; administrators only. Above 0, at most 100000, with at most
  two decimals, sent as a string or number. Money is returned as a string with two decimals. A new fee
  applies to later charges only.
method: PUT
url: '{{base_url}}/doctors/:doctor/fee'
order: 1000
pathVariables:
  - key: 'doctor'
    value: '{{doctor_id}}'
    description: 'The doctor id (not the staff account id)'
headers:
  - key: 'Accept'
    value: 'application/json'
  - key: 'Accept-Language'
    value: '{{locale}}'
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "amount": "300.00"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 with the fee as a string', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().data).to.include({ amount: '300.00' });
      });
examples: './.resources/set doctor fee.resources/examples'
