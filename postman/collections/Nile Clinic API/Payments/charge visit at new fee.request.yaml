$kind: http-request
description: |-
  After cancelling, the visit can be charged again, at the current fee. The id is stored in `second_charge_id`.
method: POST
url: '{{base_url}}/visits/:visit/charge'
order: 19000
pathVariables:
  - key: 'visit'
    value: '{{visit_id}}'
    description: 'The queue entry id'
headers:
  - key: 'Accept'
    value: 'application/json'
  - key: 'Accept-Language'
    value: '{{locale}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('201 at the new fee', () => {
        pm.response.to.have.status(201);
        pm.expect(pm.response.json().data).to.include({ status: 'unpaid', fee: '400.00' });
        pm.collectionVariables.set('second_charge_id', String(pm.response.json().data.id));
      });
examples: './.resources/charge visit at new fee.resources/examples'
