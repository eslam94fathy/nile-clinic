$kind: http-request
description: |-
  The rest of the balance, by another method.
method: POST
url: '{{base_url}}/charges/:charge/payments'
order: 9000
pathVariables:
  - key: 'charge'
    value: '{{charge_id}}'
    description: 'The charge id'
headers:
  - key: 'Accept'
    value: 'application/json'
  - key: 'Accept-Language'
    value: '{{locale}}'
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "amount": "199.90",
      "method": "card"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('201 paid', () => {
        pm.response.to.have.status(201);
        pm.expect(pm.response.json().data).to.include({ status: 'paid', amount_paid: '300.00', balance: '0.00' });
        pm.expect(pm.response.json().data.payments).to.have.lengthOf(2);
      });
examples: './.resources/record remaining payment.resources/examples'
