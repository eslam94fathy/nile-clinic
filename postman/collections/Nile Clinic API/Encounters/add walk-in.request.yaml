$kind: http-request
description: |-
  Setup, as the administrator: a record starts from a visit, so this puts `patient_id` on
  `doctor_id`'s list for today. The entry id is stored in `visit_id`. The Queues folder leaves nobody
  waiting, so the next call picks this patient.
method: POST
url: '{{base_url}}/queue/walk-ins'
order: 1000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: 'Accept'
    value: 'application/json'
  - key: 'Accept-Language'
    value: '{{locale}}'
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "patient_id": {{patient_id}},
      "doctor_id": {{doctor_id}}
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('201 waiting walk-in', () => {
        pm.response.to.have.status(201);
        const data = pm.response.json().data;
        pm.expect(data).to.include({ status: 'waiting', walk_in: true });
        pm.collectionVariables.set('visit_id', String(data.id));
      });
examples: './.resources/add walk-in.resources/examples'
