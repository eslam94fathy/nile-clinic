$kind: collection
name: Nile Clinic API
description: |-
  Backend API of the Nile Clinic Management System (Laravel 13, `/api/v1`).

  Contracts: `specs/001-project-foundation/contracts/health.openapi.yaml`,
  `specs/002-staff-auth-roles/contracts/staff-auth.openapi.yaml`,
  `specs/003-patient-records/contracts/patients.openapi.yaml`,
  `specs/004-doctors-specialties/contracts/doctors.openapi.yaml`,
  `specs/005-scheduling-availability/contracts/scheduling.openapi.yaml`,
  `specs/006-appointments/contracts/appointments.openapi.yaml`,
  `specs/007-patient-queues/contracts/queues.openapi.yaml`,
  `specs/008-medical-encounters/contracts/encounters.openapi.yaml`, and
  `specs/009-payments/contracts/payments.openapi.yaml`.

  **Run order**: System → Auth/sign in (stores `token`) → Auth → Staff → Patients → Specialties →
  Doctors → Scheduling → Appointments → Queues → Encounters → Payments → clear weekly schedule → sign out. Select the **Nile Clinic Local** environment and set
  `admin_email` / `admin_password` to an administrator created with `php artisan
  staff:create-admin`. All data must be synthetic.

  Every request sends `Accept: application/json` and `Accept-Language: {{locale}}` (`en` or `ar`);
  field names and structure are identical in both locales, only `message` texts change.
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
variables:
  - key: token
    value: ''
    description: Set by "Auth/sign in"; cleared by "Auth/sign out".
  - key: staff_member_id
    value: ''
    description: Set by "Staff/create staff member".
  - key: new_staff_email
    value: ''
    description: Unique synthetic email generated before "Staff/create staff member".
  - key: patient_id
    value: ''
    description: 'Set by "Patients/register patient".'
  - key: specialty_suffix
    value: ''
    description: 'Unique suffix generated before "Specialties/add specialty".'
  - key: specialty_id
    value: ''
    description: 'Set by "Specialties/add specialty".'
  - key: new_doctor_email
    value: ''
    description: 'Unique synthetic email generated before "Doctors/create doctor account".'
  - key: doctor_user_id
    value: ''
    description: 'Set by "Doctors/create doctor account".'
  - key: doctor_registration_number
    value: ''
    description: 'Unique number generated before "Doctors/create doctor profile".'
  - key: doctor_id
    value: ''
    description: 'Set by "Doctors/create doctor profile".'
  - key: slots_from
    value: ''
    description: 'Tomorrow, set before "Scheduling/list slots".'
  - key: slots_to
    value: ''
    description: 'Six days after slots_from, set before "Scheduling/list slots".'
  - key: time_off_id
    value: ''
    description: 'Set by "Scheduling/record time off".'
  - key: appointment_id
    value: ''
    description: 'Set by "Appointments/book appointment".'
  - key: queue_date
    value: ''
    description: 'The clinic''s today, set by "Queues/set hours for today".'
  - key: queue_weekday
    value: ''
    description: 'Today''s weekday in clinic time, set by "Queues/set hours for today".'
  - key: queue_slot
    value: ''
    description: 'First slot left today, set by "Queues/list slots for today".'
  - key: queue_slot_2
    value: ''
    description: 'Second slot left today, set by "Queues/list slots for today".'
  - key: queue_appointment_id
    value: ''
    description: 'Set by "Queues/book appointment for today".'
  - key: queue_appointment_2_id
    value: ''
    description: 'Set by "Queues/book appointment to undo".'
  - key: queue_patient_id
    value: ''
    description: 'Set by "Queues/register walk-in patient".'
  - key: queue_first_entry_id
    value: ''
    description: 'First in queue order, set by "Queues/list doctor queue".'
  - key: queue_second_entry_id
    value: ''
    description: 'Second in queue order, set by "Queues/list doctor queue".'
  - key: queue_left_entry_id
    value: ''
    description: 'Set by "Queues/add walk-in to leave".'
  - key: queue_undo_entry_id
    value: ''
    description: 'Set by "Queues/check in appointment to undo".'
  - key: visit_id
    value: ''
    description: 'Queue entry id, set by "Encounters/add walk-in".'
  - key: doctor_token
    value: ''
    description: 'Set by the "sign in as doctor" requests in Queues, Encounters, and Payments; cleared by their "sign out as doctor" requests.'
  - key: encounter_id
    value: ''
    description: 'Set by "Encounters/start encounter".'
  - key: encounter_date
    value: ''
    description: 'The visit date, set by "Encounters/start encounter".'
  - key: charge_id
    value: ''
    description: 'Set by "Payments/charge visit".'
  - key: second_charge_id
    value: ''
    description: 'Set by "Payments/charge visit at new fee".'
  - key: charged_entry_id
    value: ''
    description: 'Queue entry id, set by "Payments/check in appointment to charge".'
  - key: undo_charge_id
    value: ''
    description: 'Set by "Payments/charge checked-in visit".'
