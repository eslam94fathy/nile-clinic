$kind: http-request
description: |-
  Setup for the refusal check: signs in the doctor and stores the token in `doctor_token`.
method: POST
url: '{{base_url}}/auth/sign-in'
order: 10000
auth:
  type: noauth
headers:
  - key: 'Accept'
    value: 'application/json'
  - key: 'Accept-Language'
    value: '{{locale}}'
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "email": "{{new_doctor_email}}",
      "password": "postman-doctor-pass-1"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 with a doctor token', () => {
        pm.response.to.have.status(200);
        pm.collectionVariables.set('doctor_token', pm.response.json().data.token);
      });
examples: './.resources/sign in as doctor.resources/examples'
