$kind: http-example
request:
  url: '{{base_url}}/health'
  method: GET
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {"status": "unavailable", "checks": {"database": "unavailable"}}
